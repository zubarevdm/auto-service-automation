server {
    listen 80;
    server_name api.вашдомен.ru;      # ← поменять

    # после certbot здесь появится 443/ssl-блок автоматически

    # вебхуки телефонии и SMS + API голосового робота
    location ~ ^/(webhook|api)/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8040;
    }

    # дашборд и отчёты — закрыты паролем
    location / {
        auth_basic "Callcatch";
        auth_basic_user_file /etc/nginx/.htpasswd-callcatch;  # htpasswd -c ...
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
    }
}
